[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxindrive"
version = "0.26.27"
description = "Native multi-provider cloud sync and streaming client for desktop and mobile"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TuxInDrive contributors"}]
dependencies = [
    "cryptography>=50.0.0,<51",
    "defusedxml>=0.7.1,<0.8",
    "keyring>=25.6.0,<26; platform_system != 'Linux'",
]

[project.scripts]
tuxindrive = "tuxindrive.app:main"
tuxindrive-rclone-password = "tuxindrive.password_helper:main"
tuxindrive-server = "tuxindrive.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

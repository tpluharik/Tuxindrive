name: tuxindrive
base: core24
version: "0.26.33"
summary: Multi-cloud sync, streaming, and encrypted collaboration
description: |
  TuxInDrive is a Linux-first desktop client for synchronizing and streaming
  user-selected folders across multiple cloud providers. It also supports
  searchable synchronized folders, encrypted peer collaboration, offline
  files, recovery, and optional Nautilus integration.
grade: stable
confinement: classic
license: MIT
icon: branding/tuxindrive-logo.png
website: https://github.com/tpluharik/Tuxindrive
source-code: https://github.com/tpluharik/Tuxindrive
issues: https://github.com/tpluharik/Tuxindrive/issues

apps:
  tuxindrive:
    command: bin/tuxindrive
    common-id: io.github.tuxindrive.TuxInDrive
    desktop: share/applications/io.github.tuxindrive.TuxInDrive.desktop
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages

parts:
  tuxindrive:
    plugin: python
    source: .
    build-attributes:
      - enable-patchelf
    build-packages:
      - python3-dev
    python-packages:
      - cryptography==50.0.0
      - defusedxml==0.7.1
    stage-packages:
      - ca-certificates
      - fuse3
      - git
      - gir1.2-ayatanaappindicator3-0.1
      - gir1.2-gtk-3.0
      - libnotify-bin
      - libsecret-tools
      - openssh-client
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3
      - python3-gi
      - python3-minimal
      - python3-venv
      - python3.12-minimal
      - python3.12-venv
      - rclone
      - xdg-utils
    override-build: |
      craftctl default
      install -Dm644 packaging/io.github.tuxindrive.TuxInDrive.desktop \
        "$CRAFT_PART_INSTALL/share/applications/io.github.tuxindrive.TuxInDrive.desktop"
      install -d "$CRAFT_PART_INSTALL/share/icons/hicolor/scalable/apps"
      for icon in packaging/tuxindrive.svg packaging/tuxindrive-sync.svg \
        packaging/tuxindrive-sync-0.svg packaging/tuxindrive-sync-1.svg \
        packaging/tuxindrive-sync-2.svg packaging/tuxindrive-sync-3.svg \
        packaging/tuxindrive-sync-4.svg packaging/tuxindrive-sync-5.svg \
        packaging/tuxindrive-sync-6.svg packaging/tuxindrive-sync-7.svg \
        packaging/tuxindrive-error.svg; do
        install -Dm644 "$icon" \
          "$CRAFT_PART_INSTALL/share/icons/hicolor/scalable/apps/$(basename "$icon")"
      done

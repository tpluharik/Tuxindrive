<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>.t{font-family:Ubuntu,Arial,sans-serif;fill:#30343b}.h{font-size:25px;font-weight:700}.l{font-size:17px}.s{font-size:14px;fill:#667085}.box{fill:#fff;stroke:#bcc5d0;stroke-width:2}.field{fill:#f8fafc;stroke:#b6bec8}.blue{fill:#2374e1}.white{fill:#fff;font-weight:700}.green{fill:#218739}</style>
  <rect width="1200" height="680" fill="#edf1f5"/><text x="600" y="48" text-anchor="middle" class="t h">TuxInDrive 0.14.0 · Encrypted Profile migration</text>
  <rect x="220" y="78" width="760" height="545" rx="14" class="box"/><text x="265" y="125" class="t h">Encrypted TuxInDrive Profile</text>
  <text x="265" y="158" class="t s">Your configuration is encrypted on this computer before it reaches your cloud account.</text>
  <text x="265" y="205" class="t l">Profile storage account</text><rect x="535" y="178" width="390" height="42" rx="6" class="field"/><text x="555" y="205" class="t l">Google Drive · Personal</text>
  <text x="265" y="263" class="t l">Backup password</text><rect x="535" y="236" width="390" height="42" rx="6" class="field"/><text x="555" y="263" class="t l">••••••••••••••</text>
  <text x="265" y="321" class="t l">Confirm password</text><rect x="535" y="294" width="390" height="42" rx="6" class="field"/><text x="555" y="321" class="t l">••••••••••••••</text>
  <rect x="535" y="359" width="20" height="20" rx="3" class="field"/><text x="570" y="375" class="t l">Include OAuth credentials and peer private keys</text>
  <text x="265" y="425" class="t s">Sensitive migration is off by default. TuxInDrive cannot recover a forgotten password.</text>

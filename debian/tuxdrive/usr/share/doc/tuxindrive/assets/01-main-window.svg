<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<style>text{font-family:Ubuntu,Arial,sans-serif;fill:#263238}.small{font-size:13px}.label{font-size:16px}.title{font-size:20px;font-weight:700}.muted{fill:#6b7280}.btn{fill:#fff;stroke:#c9ced6}.call{fill:#1769ff}.calltext{fill:#fff;font-weight:700}.line{stroke:#1769ff;stroke-width:2}</style>
<rect width="1200" height="680" rx="12" fill="#eef1f5"/><rect x="18" y="18" width="1164" height="644" rx="10" fill="#fff" stroke="#cbd2da"/>
<rect x="18" y="18" width="1164" height="56" rx="10" fill="#f4f5f6"/><text x="600" y="43" text-anchor="middle" class="title">TuxInDrive</text><text x="600" y="62" text-anchor="middle" class="small muted">Eight cloud services · sync and streaming</text>
<rect x="18" y="74" width="250" height="588" fill="#f8f9fa"/><text x="38" y="107" class="title">Cloud accounts</text><rect x="36" y="127" width="214" height="68" rx="8" fill="#fff" stroke="#d9dde2"/><circle cx="61" cy="151" r="14" fill="#2f80ed"/><text x="86" y="149" class="label" font-weight="700">Work Drive</text><text x="86" y="171" class="small muted">Google Drive · Connected</text><rect x="36" y="210" width="214" height="36" rx="6" class="btn"/><text x="143" y="233" text-anchor="middle" class="small">Connect account</text>

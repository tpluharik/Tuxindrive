<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><style>text{font-family:Ubuntu,Arial,sans-serif;fill:#30343b}.h{font-size:27px;font-weight:700}.l{font-size:17px}.s{font-size:14px;fill:#667085}.field{fill:#fff;stroke:#b8c0cc}.btn{fill:#1769ff}.white{fill:#fff;font-weight:700}.note{fill:#eef5ff;stroke:#8bb8ff}</style><rect width="1000" height="650" fill="#e9edf2"/><rect x="165" y="42" width="670" height="566" rx="14" fill="#fff" stroke="#b7bec8"/><rect x="165" y="42" width="670" height="54" rx="14" fill="#f3f4f6"/><text x="500" y="76" text-anchor="middle" class="l" font-weight="700">Connect Google Drive</text><text x="205" y="142" class="h">Connect Google Drive</text><text x="205" y="176" class="l">Authorization opens in your default browser.</text><text x="205" y="199" class="s">TuxInDrive never sees or stores your cloud password.</text><text x="205" y="244" class="l">Account key</text><rect x="440" y="219" width="330" height="42" rx="6" class="field"/><text x="456" y="246" class="l">work-google</text><text x="205" y="298" class="l">Display name</text><rect x="440" y="273" width="330" height="42" rx="6" class="field"/><text x="456" y="300" class="l">Work Drive</text><text x="205" y="352" class="l">OAuth client ID (optional)</text><rect x="440" y="327" width="330" height="42" rx="6" class="field"/><text x="205" y="406" class="l">OAuth client secret (optional)</text><rect x="440" y="381" width="330" height="42" rx="6" class="field"/><rect x="205" y="450" width="565" height="68" rx="8" class="note"/><text x="225" y="478" class="l" font-weight="700">OAuth security</text><text x="225" y="502" class="s">Sign in only on accounts.google.com or login.microsoftonline.com.</text><rect x="588" y="548" width="182" height="40" rx="7" class="btn"/><text x="679" y="574" text-anchor="middle" class="white">Open browser and connect</text><rect x="493" y="548" width="82" height="40" rx="7" class="field"/><text x="534" y="574" text-anchor="middle" class="l">Cancel</text></svg>

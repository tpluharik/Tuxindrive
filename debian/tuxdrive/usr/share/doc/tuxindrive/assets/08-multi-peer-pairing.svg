<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
 <style>text{font-family:Ubuntu,Arial,sans-serif;fill:#263238}.h{font-size:26px;font-weight:bold}.t{font-size:17px}.s{font-size:14px;fill:#58636d}.panel{fill:#fff;stroke:#c4cbd2}.button{fill:#e9edf1;stroke:#b5bdc5}.blue{fill:#3584e4}.green{fill:#2ec27e}</style>
 <rect width="1200" height="700" fill="#eef1f4"/><text x="55" y="55" class="h">TuxInDrive 0.9.0 · Private collaboration</text>
 <rect x="45" y="85" width="535" height="565" rx="14" class="panel"/><text x="75" y="130" class="h">Authorized peer devices</text>
 <g class="t"><text x="85" y="180">✓  Alice · Work laptop</text><text x="85" y="220">✓  Bob · Desktop</text><text x="85" y="260">○  Test device · disabled</text></g>
 <rect x="75" y="290" width="210" height="42" rx="7" class="button"/><text x="100" y="317" class="t">Authorize device</text><rect x="300" y="290" width="190" height="42" rx="7" class="button"/><text x="326" y="317" class="t">Revoke selected</text>
 <text x="75" y="385" class="h">Safe edit leases</text><circle cx="90" cy="430" r="11" class="green"/><text x="115" y="436" class="t">10-minute cooperative lease</text><text x="75" y="475" class="s">Foreign active leases pause transfers.</text><text x="75" y="503" class="s">Expired leases never permanently block a file.</text>
 <rect x="620" y="85" width="535" height="565" rx="14" class="panel"/><text x="650" y="130" class="h">Find on LAN</text>
 <rect x="650" y="160" width="475" height="95" rx="8" fill="#f7f9fa"/><text x="675" y="195" class="t">Design team share · 192.168.1.24:22022</text><text x="675" y="228" class="s">SHA256:9sA…full fingerprint shown in app</text>
 <rect x="650" y="275" width="180" height="42" rx="7" class="blue"/><text x="674" y="302" class="t" fill="#fff">Scan local network</text><rect x="850" y="275" width="190" height="42" rx="7" class="button"/><text x="875" y="302" class="t">Use selected peer</text>
 <text x="650" y="380" class="h">Offline QR pairing</text><rect x="670" y="410" width="150" height="150" fill="#fff" stroke="#222"/><path d="M685 425h45v45h-45zm75 0h45v45h-45zm-75 75h45v45h-45zm75-15h15v15h15v15h-30zm15 45h30v15h-45v-30h15z" fill="#111"/><text x="850" y="450" class="t">Show invitation QR</text><text x="850" y="490" class="t">Import QR image</text><text x="850" y="530" class="s">Generated and decoded locally.</text><text x="650" y="610" class="s">Always verify the complete host-key fingerprint.</text>
</svg>

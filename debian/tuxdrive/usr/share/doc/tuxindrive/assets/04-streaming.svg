<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Ubuntu,Arial,sans-serif;fill:#263238}.h{font-size:25px;font-weight:700}.l{font-size:17px}.s{font-size:14px;fill:#667085}.box{fill:#fff;stroke:#b9c2cc}.sync{fill:#eaf3ff;stroke:#3b82f6}.stream{fill:#f2ecff;stroke:#7c3aed}.ok{fill:#eaf8e4;stroke:#47a31f}.arrow{stroke:#667085;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#667085"/></marker></defs><rect width="1200" height="680" fill="#eef1f5"/><text x="600" y="52" text-anchor="middle" class="h">Hybrid downloaded + files-on-demand layout</text><rect x="70" y="90" width="480" height="500" rx="12" class="box"/><text x="100" y="130" class="h">Local folder tree</text><text x="110" y="180" class="l">📁 TuxInDrive/GoogleDrive</text><text x="150" y="225" class="l">📁 Projects</text><rect x="140" y="242" width="360" height="76" rx="8" class="sync"/><text x="165" y="271" class="l" font-weight="700">Downloaded two-way folder</text><text x="165" y="298" class="s">Contents stored locally and synchronized</text><text x="150" y="360" class="l">📁 Finance</text><rect x="140" y="377" width="360" height="76" rx="8" class="sync"/><text x="165" y="406" class="l" font-weight="700">Downloaded two-way folder</text><text x="165" y="433" class="s">Incremental callbacks enabled</text><text x="150" y="495" class="l">🖥 Online</text><rect x="140" y="512" width="360" height="58" rx="8" class="stream"/><text x="165" y="542" class="l" font-weight="700">FUSE streaming mount</text><text x="165" y="561" class="s">Empty before mounting</text><rect x="650" y="90" width="480" height="500" rx="12" class="box"/><text x="680" y="130" class="h">Automatic protection</text><rect x="690" y="170" width="400" height="90" rx="8" class="ok"/><text x="715" y="202" class="l" font-weight="700">Parent full sync filters</text><text x="715" y="232" class="l">/Online</text><text x="820" y="232" class="l">/Online/**</text><rect x="690" y="285" width="400" height="90" rx="8" class="ok"/><text x="715" y="317" class="l" font-weight="700">Incremental watcher</text><text x="715" y="347" class="s">Prunes Online subtree before scanning</text><rect x="690" y="400" width="400" height="130" rx="8" class="stream"/><text x="715" y="432" class="l" font-weight="700">Files on demand</text><text x="715" y="462" class="s">Folder listing = metadata only</text><text x="715" y="489" class="s">Open file = chunked cloud read</text><text x="715" y="516" class="s">Save file = cached write-back</text><line x1="505" y1="540" x2="680" y2="465" class="arrow"/><text x="600" y="625" text-anchor="middle" class="l">Allowed: streaming child inside normal tree · Not allowed: streaming parent over normal jobs</text></svg>

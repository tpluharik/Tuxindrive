<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Ubuntu,Arial,sans-serif;fill:#2d333b}.h{font-size:23px;font-weight:700}.l{font-size:16px}.s{font-size:13px;fill:#667085}.box{fill:#fff;stroke:#b8c1cc}.rule{fill:#f8fafc;stroke:#d2d8e0}.danger{fill:#fff2f2;stroke:#ef4444}.primary{fill:#1769ff}.white{fill:#fff;font-weight:700}.minus{fill:#e8edf3}</style><rect width="1200" height="680" fill="#edf0f4"/><rect x="45" y="45" width="520" height="590" rx="12" class="box"/><text x="80" y="90" class="h">Synchronization exceptions</text><text x="80" y="120" class="s">Rules are applied to full and incremental synchronization.</text><g transform="translate(80 155)"><rect width="450" height="48" rx="7" class="rule"/><text x="18" y="30" class="l">.Trash-*/**</text><circle cx="420" cy="24" r="14" class="minus"/><text x="420" y="30" text-anchor="middle" class="h">−</text><rect y="62" width="450" height="48" rx="7" class="rule"/><text x="18" y="92" class="l">*.part</text><circle cx="420" cy="86" r="14" class="minus"/><text x="420" y="92" text-anchor="middle" class="h">−</text><rect y="124" width="450" height="48" rx="7" class="rule"/><text x="18" y="154" class="l">/Archive/private.zip</text><circle cx="420" cy="148" r="14" class="minus"/><text x="420" y="154" text-anchor="middle" class="h">−</text><rect y="205" width="330" height="44" rx="7" class="box"/><text x="15" y="233" class="s">Example: /folder/file.zip or *.tmp</text><rect x="342" y="205" width="108" height="44" rx="7" class="primary"/><text x="396" y="233" text-anchor="middle" class="white">Add exception</text></g><rect x="635" y="85" width="520" height="510" rx="14" class="box"/><circle cx="695" cy="150" r="28" fill="#ef4444"/><text x="695" y="159" text-anchor="middle" font-size="28" fill="#fff">!</text><text x="745" y="145" class="h">Google blocked a file</text><text x="745" y="174" class="l">Suspected malware or spam</text><rect x="675" y="210" width="440" height="75" rx="8" class="danger"/><text x="695" y="242" class="l" font-weight="700">Archive/tool.zip</text><text x="695" y="267" class="s">Review the source before allowing this content.</text><text x="675" y="330" class="l">Recommended action:</text><rect x="675" y="350" width="440" height="52" rx="7" class="primary"/><text x="895" y="383" text-anchor="middle" class="white">Exclude file and retry</text><rect x="675" y="420" width="440" height="52" rx="7" class="danger"/><text x="895" y="453" text-anchor="middle" class="l">Allow unsafe download and retry</text><rect x="675" y="490" width="440" height="52" rx="7" class="box"/><text x="895" y="523" text-anchor="middle" class="l">Cancel</text></svg>

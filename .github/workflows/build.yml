name: Build TuxInDrive

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Read application version
        run: echo "TUXINDRIVE_VERSION=$(sed -n 's/^__version__ = \"\([^\"]*\)\"/\1/p' src/tuxindrive/__init__.py)" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python -m pip install -c requirements-release.txt .
          python -m pip install -r requirements-ci.txt
      - name: Static security analysis
        run: bandit -q -r src -lll && pip-audit -r requirements-security.txt
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build Debian package
        run: sh scripts/build-deb.sh
      - name: Inspect Debian package
        run: dpkg-deb --info "dist/tuxindrive_${TUXINDRIVE_VERSION}_all.deb" && dpkg-deb --contents "dist/tuxindrive_${TUXINDRIVE_VERSION}_all.deb"
      - name: Generate dependency SBOM
        run: pip-audit -r requirements-security.txt --format cyclonedx-json --output "dist/tuxindrive_${TUXINDRIVE_VERSION}.cdx.json"
      - name: Collect current release artifacts
        run: |
          mkdir release-artifacts
          cp "dist/tuxindrive_${TUXINDRIVE_VERSION}_all.deb" release-artifacts/
          cp "dist/tuxdrive_${TUXINDRIVE_VERSION}_all.deb" release-artifacts/
          cp "dist/tuxindrive_${TUXINDRIVE_VERSION}.cdx.json" release-artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuxindrive-deb
          path: release-artifacts/

  isolated-process-lifecycle:
    # Real signal tests must never run in the developer's desktop session.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ubuntu:24.04
      options: --pids-limit 256
    steps:
      - name: Install isolated test prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify owned process lifecycle in disposable PID namespace
        run: PYTHONPATH=src TUXINDRIVE_ISOLATED_PROCESS_TESTS=1 python3 -m unittest discover -s integration_tests -v

  debian-core-matrix:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install build prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 dpkg-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read application version
        run: echo "TUXINDRIVE_VERSION=$(sed -n 's/^__version__ = \"\([^\"]*\)\"/\1/p' src/tuxindrive/__init__.py)" >> "$GITHUB_ENV"
      - name: Build adaptive package
        run: |
          sh scripts/build-deb.sh
          sh scripts/build-server-deb.sh
      - name: Install mandatory core only
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "./dist/tuxindrive_${TUXINDRIVE_VERSION}_all.deb"
      - name: Verify installed layout and host discovery
        run: tuxindrive --version && tuxindrive --system-check --json
      - name: Install and verify server package
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "./dist/tuxindrive-server_${TUXINDRIVE_VERSION}_all.deb"
          test -s /var/lib/tuxindrive-server/bootstrap-token
          tuxindrive-server check --config /etc/tuxindrive-server/server.json

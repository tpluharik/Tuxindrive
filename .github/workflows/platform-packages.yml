name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      collect_dependency_verification:
        description: Collect unsigned Android dependency checksums for review; never publish
        type: boolean
        default: false
      capture_native_environments:
        description: Capture unsigned native build inputs for review; never publish or sign
        type: boolean
        default: false
      native_replay_only:
        description: Validate frozen Windows/macOS builds only; never sign or publish
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "android/**"
      - "branding/**"
      - "packaging/windows/**"
      - "packaging/server/**"
      - "scripts/build-server-deb.sh"
      - "scripts/build-windows.ps1"
      - "scripts/build-windows-msys2.sh"
      - "scripts/build-windows-frozen.sh"
      - "scripts/build-environment.py"
      - "scripts/verify-native-distribution.py"
      - "packaging/build-environments/**"
      - "scripts/build-macos.sh"
      - "scripts/generate-marketplace-metadata.py"
      - "packaging/marketplaces/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/platform-packages.yml"

permissions:
  contents: read

concurrency:
  group: platform-packages-${{ github.ref }}-${{ inputs.native_replay_only && 'native' || 'full' }}
  cancel-in-progress: false

jobs:
  capture-windows:
    if: inputs.capture_native_environments
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2
        id: msys
        with:
          msystem: UCRT64
          update: false
          install: >-
            git mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-cryptography mingw-w64-ucrt-x86_64-python-defusedxml
            mingw-w64-ucrt-x86_64-python-gobject mingw-w64-ucrt-x86_64-python-keyring
            mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-pyinstaller
      - name: Capture the reviewed runtime and Inno Setup, without application code
        shell: pwsh
        env:
          CAPTURE_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: python scripts/build-environment.py capture --platform windows-x64 --runtime "$env:CAPTURE_MSYS_ROOT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-environment-windows-x64
          retention-days: 7
          path: build-environment-candidate/*

  capture-macos:
    if: inputs.capture_native_environments
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the established GTK runtime for capture only
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install gtk+3 pygobject3
      - name: Capture the reviewed runtime closure, without application code
        run: /usr/bin/python3 scripts/build-environment.py capture --platform macos-arm64 --runtime /opt/homebrew
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-environment-macos-arm64
          retention-days: 7
          path: build-environment-candidate/*

  safety-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ubuntu:24.04
      options: --pids-limit 256
    steps:
      - name: Install disposable test runtime
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates python3-venv
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned test dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --require-hashes -r requirements-build-tools.lock
          .venv-ci/bin/python -m pip install --require-hashes --no-build-isolation -r requirements-ci-linux.lock
          .venv-ci/bin/python -m pip install --no-deps --no-build-isolation .
      - name: Run signal-guarded unit suite
        run: PYTHONPATH=src .venv-ci/bin/python -m unittest discover -s tests -v
      - name: Run real lifecycle checks in disposable PID namespace
        run: PYTHONPATH=src TUXINDRIVE_ISOLATED_PROCESS_TESTS=1 .venv-ci/bin/python -m unittest discover -s integration_tests -v

  linux:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments && !inputs.native_replay_only }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build Debian package
        id: build
        run: |
          sh scripts/build-deb.sh
          sh scripts/build-server-deb.sh
          python3 -m pip install --require-hashes -r requirements-build-tools.lock
          python3 -m pip install --require-hashes --no-build-isolation -r requirements-ci-linux.lock
          version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          python3 -m pip_audit -r requirements-security.txt --format cyclonedx-json \
            --output "dist/TuxInDrive-${version}-python.cdx.json"
      - name: Stage dedicated Linux release folder
        run: |
          version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          mkdir -p releases/linux/packages
          cp "dist/tuxindrive_${version}_all.deb" releases/linux/packages/
          cp "dist/tuxindrive-server_${version}_all.deb" releases/linux/packages/
          cp "dist/TuxInDrive-${version}-python.cdx.json" releases/linux/packages/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-linux
          retention-days: 7
          path: |
            releases/linux/packages/tuxindrive_*_all.deb
            releases/linux/packages/tuxindrive-server_*_all.deb
            releases/linux/packages/TuxInDrive-*-python.cdx.json

  legacy-upgrades:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        from-version: ["0.18.1", "0.19.1", "0.26.2", "0.26.79"]
    container:
      image: ubuntu:24.04
      options: --pids-limit 256
    steps:
      - name: Install isolated upgrade prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-linux
          path: current-packages
      - name: Verify historical parser, helper staging and clean APT upgrade
        env:
          TUXINDRIVE_ISOLATED_UPGRADE_TESTS: "1"
          FROM_VERSION: ${{ matrix.from-version }}
          RELEASE_VERSION: ${{ needs.linux.outputs.version }}
          DEBIAN_FRONTEND: noninteractive
        run: python3 scripts/test-legacy-upgrade.py --from-version "$FROM_VERSION" --package "current-packages/tuxindrive_${RELEASE_VERSION}_all.deb"

  windows:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore SHA-256-pinned Windows runtime and installer compiler
        shell: pwsh
        run: python scripts/build-environment.py restore --platform windows-x64 --lock packaging/build-environments/windows-x64.lock.json
      - name: Freeze Windows application using only the verified environment
        shell: pwsh
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "1"
        run: |
          $bash = Join-Path $env:TUXINDRIVE_MSYS_ROOT 'usr\bin\bash.exe'
          & $bash -lc 'sh scripts/build-windows-frozen.sh'
          if ($LASTEXITCODE -ne 0) { throw 'Verified Windows build failed' }
      - name: Record Windows package inputs
        shell: pwsh
        run: |
          Copy-Item packaging/build-environments/windows-x64.lock.json build-inputs/
          $env:ImageVersion | Set-Content build-inputs/windows-host-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-inputs-windows
          retention-days: 90
          path: build-inputs/*
      - name: Build Windows installer and portable archive
        shell: pwsh
        run: scripts/build-windows.ps1 -PackageOnly
      - name: Enforce requested Windows native-signing policy
        shell: pwsh
        env:
          TUXINDRIVE_REQUIRE_WINDOWS_SIGNING: ${{ vars.TUXINDRIVE_REQUIRE_WINDOWS_SIGNING || '0' }}
          TUXINDRIVE_WINDOWS_CERT_SHA256: ${{ vars.TUXINDRIVE_WINDOWS_CERT_SHA256 }}
        run: |
          $version = (Select-String -Path src/tuxindrive/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          python scripts/verify-native-distribution.py --platform windows --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows verification failed; refusing unsigned fallback' }
      - name: Verify frozen Windows application starts without opening an account
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\build\windows\TuxInDrive\TuxInDrive.exe" -ArgumentList '--version' -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Frozen application smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Frozen application could not load its runtime' }
      - name: Stage dedicated Windows release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases/windows/packages | Out-Null
          Copy-Item dist/TuxInDrive-*-windows-x64-setup.exe releases/windows/packages/
          Copy-Item dist/TuxInDrive-*-windows-x64-portable.zip releases/windows/packages/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-windows-x64
          retention-days: 7
          path: |
            releases/windows/packages/TuxInDrive-*-windows-x64-setup.exe
            releases/windows/packages/TuxInDrive-*-windows-x64-portable.zip

  macos:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore SHA-256-pinned macOS runtime closure
        run: /usr/bin/python3 scripts/build-environment.py restore --platform macos-arm64 --lock packaging/build-environments/macos-arm64.lock.json
      - name: Install Python application dependencies
        env:
          PYTHONPATH: /opt/homebrew/opt/pygobject3/lib/python3.14/site-packages:/opt/homebrew/opt/py3cairo/lib/python3.14/site-packages
        run: |
          "$TUXINDRIVE_FROZEN_PYTHON" -m venv .venv-macos
          .venv-macos/bin/python -m pip install --require-hashes -r requirements-build-tools.lock
          .venv-macos/bin/python -m pip install --require-hashes --only-binary=:all: --no-build-isolation -r requirements-runtime-macos.lock
          .venv-macos/bin/python -m pip download --no-deps --require-hashes --only-binary=:all: \
            -r requirements-build-tools.lock --dest build/verified-build-tools
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$PWD/build/verified-build-tools" \
            .venv-macos/bin/python -m pip install --no-deps .
          .venv-macos/bin/python -c 'import gi; gi.require_version("Gtk", "3.0"); from gi.repository import Gtk, Gio, GLib; import cryptography, defusedxml; import keyring.backends.macOS; assert Gtk.get_major_version() == 3'
      - name: Record macOS package inputs
        run: |
          mkdir -p build-inputs
          cp packaging/build-environments/macos-arm64.lock.json build-inputs/
          cp packaging/build-environments/macos-arm64-baseline.json build-inputs/
          printf '%s\n' "$ImageVersion" > build-inputs/macos-host-image.txt
          .venv-macos/bin/python -m pip list --format=json > build-inputs/macos-python-packages.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-inputs-macos
          retention-days: 90
          path: build-inputs/*
      - name: Build ad-hoc signed macOS application image
        env:
          PYTHON_BIN: .venv-macos/bin/python
          PYTHONPATH: /opt/homebrew/opt/pygobject3/lib/python3.14/site-packages:/opt/homebrew/opt/py3cairo/lib/python3.14/site-packages
        run: sh scripts/build-macos.sh
      - name: Verify frozen macOS application starts without opening an account
        run: build/macos/TuxInDrive.app/Contents/MacOS/TuxInDrive --version
      - name: Enforce requested macOS Developer ID and notarization policy
        env:
          TUXINDRIVE_REQUIRE_MACOS_SIGNING: ${{ vars.TUXINDRIVE_REQUIRE_MACOS_SIGNING || '0' }}
          TUXINDRIVE_APPLE_TEAM_ID: ${{ vars.TUXINDRIVE_APPLE_TEAM_ID }}
        run: |
          version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          /usr/bin/python3 scripts/verify-native-distribution.py --platform macos --version "$version"
      - name: Stage dedicated macOS release folder
        run: |
          mkdir -p releases/macos/packages
          cp dist/TuxInDrive-*-macos-*.dmg releases/macos/packages/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-macos
          retention-days: 7
          path: releases/macos/packages/TuxInDrive-*-macos-*.dmg

  android-verification:
    if: inputs.collect_dependency_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Resolve all variant inputs without compiling or signing
        run: |
          gradle -p android --no-daemon \
            -I "$GITHUB_WORKSPACE/scripts/collect-android-verification.gradle" \
            --write-verification-metadata sha256 collectVerificationDependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-dependency-verification
          retention-days: 3
          path: android/gradle/verification-metadata.xml

  android:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments && !inputs.native_replay_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.x"
          cache: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Build pinned native rclone Android library
        run: |
          git clone --depth 1 --branch v1.75.0 https://github.com/rclone/rclone.git build/rclone-android
          test "$(git -C build/rclone-android rev-parse HEAD)" = "9ee9d0a0cafd5e5fe3b271d2280b090ab6e64048"
          mkdir -p android/app/libs
          cp android/native/gomobile.go build/rclone-android/librclone/gomobile/gomobile.go
          cd build/rclone-android
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260709172247-6129f5bee9d5
          export PATH="${HOME}/go/bin:${PATH}"
          "${HOME}/go/bin/gomobile" bind -androidapi 26 -target=android -javapkg=org.rclone \
            -ldflags "-s -X github.com/rclone/rclone/fs.Version=v1.75.0" \
            -o "${GITHUB_WORKSPACE}/android/app/libs/rclone.aar" \
            github.com/rclone/rclone/librclone/gomobile
          test -s "${GITHUB_WORKSPACE}/android/app/libs/rclone.aar"
      - name: Build unsigned Android packages without signing credentials
        run: |
          version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            gradle -p android --no-daemon \
              :app:testSideloadReleaseUnitTest :app:lintSideloadRelease :app:assembleSideloadRelease \
              :app:testStoreReleaseUnitTest :app:lintStoreRelease :app:bundleStoreRelease
            package=android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk
            store_bundle=android/app/build/outputs/bundle/storeRelease/app-store-release.aab
          else
            gradle -p android --no-daemon :app:testSideloadDebugUnitTest :app:lintSideloadDebug :app:assembleSideloadDebug
            package=android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            store_bundle=
          fi
          test -s "$package"
          mkdir -p dist
          cp "$package" "dist/TuxInDrive-${version}-android-unsigned.apk"
          if [[ -n "$store_bundle" ]]; then
            test -s "$store_bundle"
            cp "$store_bundle" "dist/TuxInDrive-${version}-android-store-unsigned.aab"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-android-unsigned
          retention-days: 7
          path: |
            dist/TuxInDrive-*-android-unsigned.apk
            dist/TuxInDrive-*-android-store-unsigned.aab
  android-sign:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments && !inputs.native_replay_only && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    needs: [safety-gate, linux, legacy-upgrades, android]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-android-unsigned
          path: unsigned
      - name: Sign exact build outputs without running project or Gradle code
        env:
          RELEASE_VERSION: ${{ needs.linux.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TUXINDRIVE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          TUXINDRIVE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUXINDRIVE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = tpluharik/Tuxindrive
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools/apksigner"
          test -x "$tools/zipalign"
          task_signing_dir=$(mktemp -d "$RUNNER_TEMP/tuxindrive-sign.XXXXXXXX")
          trap 'rm -f -- "$task_signing_dir/release.jks"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$task_signing_dir/release.jks"
          keytool -exportcert -keystore "$task_signing_dir/release.jks" \
            -storepass:env TUXINDRIVE_ANDROID_STORE_PASSWORD -alias "$TUXINDRIVE_ANDROID_KEY_ALIAS" \
            -file "$task_signing_dir/certificate.der"
          expected=485e258558e47f140543e36b2092b9357fe365fae104e5c017bd28ec4209a58b
          actual=$(sha256sum "$task_signing_dir/certificate.der" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          mkdir -p releases/android/packages
          apk="TuxInDrive-$RELEASE_VERSION-android.apk"
          aab="TuxInDrive-$RELEASE_VERSION-android-store.aab"
          "$tools/zipalign" -P 16 -f 4 "unsigned/TuxInDrive-$RELEASE_VERSION-android-unsigned.apk" "$task_signing_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$task_signing_dir/release.jks" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --ks-key-alias "$TUXINDRIVE_ANDROID_KEY_ALIAS" \
            --ks-pass env:TUXINDRIVE_ANDROID_STORE_PASSWORD --key-pass env:TUXINDRIVE_ANDROID_KEY_PASSWORD \
            --out "releases/android/packages/$apk" "$task_signing_dir/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "releases/android/packages/$apk"
          jarsigner -keystore "$task_signing_dir/release.jks" \
            -storepass:env TUXINDRIVE_ANDROID_STORE_PASSWORD -keypass:env TUXINDRIVE_ANDROID_KEY_PASSWORD \
            -signedjar "releases/android/packages/$aab" \
            "unsigned/TuxInDrive-$RELEASE_VERSION-android-store-unsigned.aab" "$TUXINDRIVE_ANDROID_KEY_ALIAS"
          jarsigner -verify "releases/android/packages/$aab"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-android
          retention-days: 7
          # apksigner can also create an optional .idsig sidecar. It is not a
          # standalone package or part of the nine-product release contract.
          path: |
            releases/android/packages/TuxInDrive-*-android.apk
            releases/android/packages/TuxInDrive-*-android-store.aab

  publish-release:
    if: ${{ !inputs.collect_dependency_verification && !inputs.capture_native_environments && !inputs.native_replay_only && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    needs: [safety-gate, linux, legacy-upgrades, windows, macos, android-sign]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-linux
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-windows-x64
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-macos
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuxindrive-android
          path: release-assets
      - name: Validate version-bound platform packages
        run: |
          version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            test "$release_tag" = "v$version"
          else
            release_tag="v$version"
          fi
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          find release-assets -type f -print
          test "$(find release-assets -type f -name "tuxindrive_${version}_all.deb" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "tuxindrive-server_${version}_all.deb" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-${version}-python.cdx.json" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-$version-windows-x64-setup.exe" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-$version-windows-x64-portable.zip" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-$version-macos-*.dmg" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-$version-android.apk" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "TuxInDrive-$version-android-store.aab" | wc -l)" -eq 1
          python3 scripts/generate-marketplace-metadata.py \
            --asset-dir release-assets --output marketplace-metadata
          tar -C marketplace-metadata -czf \
            "release-assets/TuxInDrive-$version-marketplace-metadata.tar.gz" .
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sed -i 's#release-assets/##g' SHA256SUMS.txt
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt
      - name: Publish durable platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t packages < <(find release-assets -type f -print)
          test "${#packages[@]}" -eq 10
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Published assets cannot be replaced; bump the version."
            exit 1
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" \
              --target "$GITHUB_SHA" --generate-notes --title "TuxInDrive ${RELEASE_TAG#v}"
          fi

name: Build and publish Snap

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "src/**"
      - "branding/**"
      - "packaging/io.github.tuxindrive.TuxInDrive.desktop"
      - "snap/**"
      - "pyproject.toml"
      - ".github/workflows/snapcraft-publish.yml"

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify snap version
        run: |
          app_version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          snap_version=$(sed -n 's/^version: "\([^"]*\)"/\1/p' snap/snapcraft.yaml)
          test "$snap_version" = "$app_version"
      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79
      - name: Publish to edge
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40
        env:
          SNAPCRAFT_STORE_AUTH: candid
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: edge

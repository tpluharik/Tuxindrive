name: Build isolated Network Lab release

on:
  workflow_dispatch:
    inputs:
      lab_revision:
        description: Separate Network Lab package revision
        required: true
        default: "5"
  push:
    tags: ["network-lab-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve separate lab version
        env:
          INPUT_REVISION: ${{ inputs.lab_revision }}
        run: |
          app_version=$(PYTHONPATH=src python3 -c 'from tuxindrive import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/network-lab-v* ]]; then
            release_version=${GITHUB_REF_NAME#network-lab-v}
            test "${release_version%.*}" = "$app_version"
            revision=${release_version##*.}
          else
            revision=${INPUT_REVISION:-5}
            release_version="$app_version.$revision"
          fi
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          echo "TUXINDRIVE_LAB_REVISION=$revision" >> "$GITHUB_ENV"
          echo "LAB_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Test production-protocol scenarios
        run: |
          PYTHONPATH=src python3 -m unittest -v tests.test_network_lab
          PYTHONPATH=src python3 -m tuxindrive.network_lab --output-dir build/network-lab-ci --json
      - name: Build separate Debian package
        run: |
          sh scripts/build-network-lab-deb.sh
          package="dist/tuxindrive-network-lab_${LAB_RELEASE_VERSION%.*}+lab${TUXINDRIVE_LAB_REVISION}_all.deb"
          test -s "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          sha256sum "$package" > "$package.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuxindrive-network-lab-${{ env.LAB_RELEASE_VERSION }}
          retention-days: 14
          path: |
            dist/tuxindrive-network-lab_*_all.deb
            dist/tuxindrive-network-lab_*_all.deb.sha256
            build/network-lab-ci/summary.json
      - name: Publish separate GitHub release
        if: startsWith(github.ref, 'refs/tags/network-lab-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/tuxindrive-network-lab_*_all.deb \
            dist/tuxindrive-network-lab_*_all.deb.sha256 \
            --target "$GITHUB_SHA" --generate-notes \
            --title "TuxInDrive Network Lab $LAB_RELEASE_VERSION"
